<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="wrapper">
        <header class="clearfix">
            <div class="sansation-light-italic"><a href="index.html"  id="logo">
                <span class="pink">Нейро</span><i> Сфера</i></a>
            </div>
            <nav id="mainnav">
                <ul>
                     <li><a class="uslugi" href="uslugi.html" id="logo"><i>услуги</i></a></li>
                     <li><a class="about" href="about.html" id="logo"><i>о нас</i></a></li>
                     <li><a class="clients" href="clients.html" id="logo"><i>клиенты</i></a></li>
                     <li><a class="contacts" href="contacts.html" id="logo"><i>контакты</i></a></li>
                </ul>
                    </nav>
                </header>
                <div class="contact-form">
                    <form action="#" method="post">
                        
                        <div class="form-group">
                            <label for="topic">Тема</label>
                            <select id="topic" name="topic">
                                <option value="" disabled selected hidden>Заказать услугу</option>
                                <option value="consultation">Консультация</option>
                                <option value="support">Техническая поддержка</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>
            
                        <div class="form-group">
                            <label for="name">Имя</label>
                            <input type="text" id="name" name="name" required>
                        </div>
            
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" required>
                        </div>
            
                        <div class="form-group">
                            <label for="message">Текст сообщения</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
            
                        <button type="submit" class="submit-button">Отправить</button>
                        
                    </form>
                </div>
    <footer class="footer">
        <p class="footer__block">Написать нам &#9650;</p>
       <p class="footer__block">&copy; Новая компания</p>
       <div class="footer__icons">
           <a href="https://mail.ru/" target="_blank"><img class="footer__img" src="img/mailru.png" alt="mail"></a>
           <a href="https://ok.ru/" target="_blank"><img class="footer__img" src="img/ok.png" alt="ok"></a>
           <a href="https://vk.ru/" target="_blank"><img class="footer__img" src="img/vk.png" alt="vk"></a>
       </div>
   </footer>
</body>
</html>
